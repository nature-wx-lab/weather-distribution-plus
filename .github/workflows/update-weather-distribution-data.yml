name: Update weather distribution data

on:
  schedule:
    # Hourly fallback only. The external trigger handles the 10-minute AMeDAS
    # cadence; duplicating it here caused overlapping queued runs.
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Caller identifier (for example external-cron)"
        required: false
        default: "manual"

permissions:
  contents: write

concurrency:
  group: weather-distribution-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # A queued dispatch otherwise checks out the event's older head SHA
          # and needlessly repeats recovery work already published by the run
          # ahead of it.
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify public Git identity and privacy boundary
        run: python scripts/verify_public_git_identity.py

      - name: Run rollover and retention regression tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Refresh and validate JMA data with last-known-good fallback
        run: |
          python scripts/run_weather_distribution_refresh.py \
            --max-age-minutes 35 \
            --candidate-forecast-max-age-hours 12 \
            --retained-forecast-max-age-hours 13

      - name: Commit updated public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/temperature_distribution_tool public/weather-climatology/data/stations public/weather-climatology/data/climatology_index_1996_2025_s_stations.json
          if git diff --cached --quiet; then
            echo "No public data changes."
          else
            git commit -m "Update weather distribution data"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase -X theirs origin/main; then
                published_head="$(git rev-parse origin/main)"
                published_tree="$(git rev-parse HEAD^{tree})"
                compact_head="$(printf 'Publish current weather distribution snapshot\n' | git commit-tree "$published_tree")"
                if git push --force-with-lease="refs/heads/main:$published_head" origin "$compact_head:refs/heads/main"; then
                  exit 0
                fi
              fi
              git rebase --abort || true
              if [ "$attempt" -eq 3 ]; then
                echo "Failed to publish refreshed data after 3 attempts."
                exit 1
              fi
              delay=$((attempt * 5))
              echo "Main advanced during publish; retrying in ${delay}s."
              sleep "$delay"
            done
          fi
