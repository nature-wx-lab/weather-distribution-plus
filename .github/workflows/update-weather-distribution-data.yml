name: Update weather distribution data

on:
  schedule:
    # Best-effort fallback only. GitHub does not guarantee this cadence.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Caller identifier (for example external-cron)"
        required: false
        default: "manual"

permissions:
  contents: write

concurrency:
  group: weather-distribution-data
  # An external 10-minute trigger can arrive while a refresh is still running.
  # Queue the next refresh instead of canceling work that is nearly complete.
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh JMA data
        run: python scripts/update_weather_distribution_public.py

      - name: Verify realtime manifest freshness
        run: python scripts/verify_realtime_manifest_freshness.py --max-age-minutes 35

      - name: Commit updated public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/temperature_distribution_tool public/weather-climatology/data/stations public/weather-climatology/data/climatology_index_1996_2025_s_stations.json
          if git diff --cached --quiet; then
            echo "No public data changes."
          else
            git commit -m "Update weather distribution data"
            # A code or documentation push can land while this job is generating
            # data. Rebase and push repeatedly so a short main-branch race does
            # not turn a successful refresh into a failure notification.
            for attempt in 1 2 3; do
              if git pull --rebase -X theirs origin main && git push; then
                exit 0
              fi
              git rebase --abort || true
              if [ "$attempt" -eq 3 ]; then
                echo "Failed to publish refreshed data after 3 attempts."
                exit 1
              fi
              delay=$((attempt * 5))
              echo "Main advanced during publish; retrying in ${delay}s."
              sleep "$delay"
            done
          fi
