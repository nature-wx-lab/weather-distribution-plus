name: Update weather distribution data

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weather-distribution-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh JMA data
        run: python scripts/update_weather_distribution_public.py

      - name: Commit updated public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/temperature_distribution_tool public/weather-climatology/data/stations public/weather-climatology/data/climatology_index_1996_2025_s_stations.json
          if git diff --cached --quiet; then
            echo "No public data changes."
          else
            git commit -m "Update weather distribution data"
            git push
          fi
